[package]
name = "mugen-backend"
version = "0.1.1"
edition.workspace = true
authors.workspace = true

[dependencies]
axum = { version = "0.7", features = ["macros", "http2", "multipart"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
dotenv = "0.15"
thiserror = "1.0"
tokio = { version = "1.33", default-features = false, features = ["macros", "rt-multi-thread", "fs", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "json",
    "fmt",
    "registry",
] }
tracing-attributes = "0.1"
tracing-appender = "0.2"
tower = { version = "0.4", features = ["timeout"] }
tower-http = { version = "0.5", default-features = false, features = ["fs", "trace", "cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
surrealdb = { version = "2", features = ["kv-rocksdb"] }
argon2 = "0.5"
jsonwebtoken = "9"
clap = { version = "4.3", features = ["derive", "env"] }
toml = "0.8"
tokio_schedule = "0.3"
common = { path = "../common" }
dyn-logger = "0.2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
infer = "0.16"
