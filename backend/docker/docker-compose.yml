version: "3.8"
services:
  mugendb:
    image: surrealdb/surrealdb:latest
    command: start --log info --user root --pass root file:/data/mugen.db
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - surrealdb_data:/data

  # Uncomment when Meilisearch integration is added
  # meilisearch:
  #   image: getmeili/meilisearch:latest
  #   ports:
  #     - "7700:7700"
  #   volumes:
  #     - meili_data:/meili_data

volumes:
  surrealdb_data:
